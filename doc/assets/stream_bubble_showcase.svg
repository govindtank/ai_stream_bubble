<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#D946EF" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />

  <g stroke="#334155" stroke-opacity="0.15" stroke-width="1">
    <path d="M0,70 H1200 M0,140 H1200 M0,210 H1200 M0,280 H1200 M0,350 H1200 M0,420 H1200 M0,490 H1200 M0,560 H1200" />
    <path d="M70,0 V630 M140,0 V630 M210,0 V630 M280,0 V630 M350,0 V630 M420,0 V630 M490,0 V630 M560,0 V630 M630,0 V630 M700,0 V630 M770,0 V630 M840,0 V630 M910,0 V630 M980,0 V630 M1050,0 V630 M1120,0 V630" />
  </g>

  <circle cx="600" cy="315" r="280" fill="#8B5CF6" opacity="0.08" />

  <g filter="url(#cardShadow)">
    <rect x="150" y="75" width="900" height="480" rx="24" fill="#0F172A" stroke="#1E293B" stroke-width="2" />
    <rect x="150" y="75" width="900" height="480" rx="24" fill="none" stroke="url(#accent)" stroke-width="1.5" stroke-opacity="0.4" />
  </g>

  <text x="190" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" fill="#F8FAFC" letter-spacing="-0.5">
    ai_stream_bubble
  </text>
  <text x="190" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="14" fill="#94A3B8">
    Streaming LLM Message Bubble • DeepSeek &amp; Claude Reasoning Accordions • Code Artifacts
  </text>

  <g transform="translate(740, 108)">
    <rect width="130" height="28" rx="14" fill="#4C1D95" fill-opacity="0.3" stroke="#8B5CF6" stroke-width="1" />
    <text x="65" y="18" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#C084FC">THINKING ACCORDION</text>
  </g>
  <g transform="translate(885, 108)">
    <rect width="125" height="28" rx="14" fill="#0369A1" fill-opacity="0.25" stroke="#38BDF8" stroke-width="1" />
    <text x="62" y="18" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#38BDF8">LIVE CURSOR</text>
  </g>

  <!-- Chat Simulation Area -->
  <g transform="translate(200, 205)">
    <!-- Assistant Avatar & Tag -->
    <circle cx="20" cy="20" r="18" fill="#6366F1" />
    <text x="20" y="25" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="14" fill="#FFFFFF">AI</text>
    <text x="50" y="24" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" fill="#F8FAFC">DeepSeek R1</text>
    <rect x="150" y="12" width="75" height="18" rx="9" fill="#1E293B" />
    <text x="187" y="24" text-anchor="middle" font-family="monospace" font-size="10" fill="#94A3B8">Streaming</text>

    <!-- Collapsible Reasoning Thought Bubble (<think> block) -->
    <g transform="translate(50, 40)">
      <rect width="730" height="70" rx="12" fill="#020617" stroke="#334155" stroke-width="1" />
      <text x="20" y="26" font-family="-apple-system, sans-serif" font-weight="700" font-size="12" fill="#A855F7">🧠 Thought for 3.2 seconds</text>
      <text x="20" y="50" font-family="monospace" font-size="11" fill="#64748B">Analyzing algorithmic complexity: O(N log N) via balanced merge intervals...</text>
    </g>

    <!-- Markdown Response with Blinking Cursor -->
    <g transform="translate(50, 125)">
      <rect width="730" height="140" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="20" y="32" font-family="-apple-system, sans-serif" font-weight="700" font-size="15" fill="#F8FAFC">Here is the optimized Dart solution:</text>
      
      <!-- Code Artifact Box -->
      <g transform="translate(20, 48)">
        <rect width="690" height="70" rx="8" fill="#0B0F19" />
        <text x="16" y="28" font-family="monospace" font-size="12" fill="#38BDF8">List&lt;Interval&gt; merge(List&lt;Interval&gt; intervals) {</text>
        <text x="16" y="48" font-family="monospace" font-size="12" fill="#94A3B8">  intervals.sort((a, b) =&gt; a.start.compareTo(b.start));</text>
        <!-- Blinking Terminal Cursor -->
        <rect x="425" y="36" width="8" height="15" fill="#38BDF8" />
      </g>
    </g>
  </g>
</svg>